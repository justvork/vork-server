<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Policies — Vork</title>
    <link rel="icon" type="image/png" href="/images/Vork-Faviconx128.png" th:href="@{/images/Vork-Faviconx128.png}">
    <link rel="stylesheet" href="/css/tailwind.css" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" href="/packages/npm.fortawesome/fontawesome-free/current/css/all.min.css" th:href="@{/packages/npm.fortawesome/fontawesome-free/current/css/all.min.css}">
    <link rel="stylesheet" href="/css/vork.css" th:href="@{/css/vork.css}">
    <link rel="stylesheet" href="/css/settings.css" th:href="@{/css/settings.css}">
</head>
<body class="bg-zinc-950 text-zinc-100">
<div th:replace="~{fragments/header :: header}"></div>

<div class="vork-page-shell py-4">
    <div class="vork-page-header">
        <div>
            <h2 class="flex items-center gap-2 text-2xl font-bold text-zinc-100"><i class="fa-solid fa-user-check text-[#fdaa02]"></i>Approval Policies</h2>
            <p class="vork-page-subtitle">Manage policy routing by channels with conditional day/time rules.</p>
        </div>
        <div class="vork-page-header-actions">
            <button class="rounded-lg bg-[#fdaa02] px-3 py-2 text-sm font-semibold text-black transition-colors hover:bg-[#e89a02]" onclick="openPolicyModal()">
                <i class="fa-solid fa-plus mr-2"></i>New Policy
            </button>
        </div>
    </div>

    <div class="vork-content-stack">
        <div id="alert-area"></div>

        <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-3">
            <div id="empty-state" class="vork-empty-state-card hidden">
                <i class="fa-solid fa-user-check vork-empty-icon"></i>
                <p class="vork-empty-title">No approval policies yet</p>
                <p class="vork-empty-hint">Create your first policy to route approvals to selected channels.</p>
            </div>

            <table id="policy-table" class="hidden min-w-full text-left text-sm text-zinc-200">
                <thead class="bg-zinc-800/80 text-xs uppercase tracking-wide text-zinc-300">
                <tr>
                    <th class="px-3 py-2 font-semibold">Name</th>
                    <th class="px-3 py-2 font-semibold">Channels</th>
                    <th class="px-3 py-2 font-semibold">Rules</th>
                    <th class="px-3 py-2 font-semibold">Enabled</th>
                    <th class="px-3 py-2 text-right font-semibold">Actions</th>
                </tr>
                </thead>
                <tbody id="policy-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="policyModal" tabindex="-1" aria-labelledby="policyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="policyModalLabel">New Approval Policy</h5>
                <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-zinc-700 text-zinc-300 transition-colors hover:bg-zinc-800" data-bs-dismiss="modal" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="policy-id">

                <div class="mb-3">
                    <label class="mb-1 block text-sm font-medium text-zinc-300" for="policy-name">Name <span class="text-rose-400">*</span></label>
                    <input id="policy-name" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-500 focus:border-[#fdaa02] focus:outline-none focus:ring-2 focus:ring-[#fdaa02]/25" placeholder="e.g. Finance Approvals">
                </div>

                <div class="mb-3">
                    <label class="inline-flex items-center gap-2 rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm text-zinc-200" for="policy-enabled">
                        <input type="checkbox" id="policy-enabled" class="h-4 w-4 rounded border-zinc-600 bg-zinc-950 text-cyan-400 focus:ring-cyan-500/40" checked>
                        Policy Enabled
                    </label>
                </div>

                <div class="mb-3">
                    <label class="mb-1 block text-sm font-medium text-zinc-300">Policy Channels <span class="text-rose-400">*</span></label>
                    <div id="policy-channel-pill-container" class="mb-2 flex min-h-10 flex-wrap gap-1 rounded border border-zinc-700 bg-zinc-950 p-2"></div>
                    <div class="mb-1 flex items-center gap-2 rounded-lg border border-zinc-700 bg-zinc-950 px-2">
                        <span class="text-zinc-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="policy-channel-search" class="w-full bg-transparent py-2 text-sm text-zinc-100 placeholder:text-zinc-500 focus:outline-none" placeholder="Search channels to add..." oninput="filterPolicyChannels()">
                    </div>
                    <div id="policy-channel-dropdown" class="hidden max-h-52 overflow-y-auto rounded-lg border border-zinc-700 bg-zinc-900">
                        <ul id="policy-channel-options" class="divide-y divide-zinc-800"></ul>
                    </div>
                </div>

                <div>
                    <div class="mb-2 flex items-center justify-between">
                        <label class="block text-sm font-medium text-zinc-300">Conditional Rules</label>
                        <button type="button" class="rounded-md border border-zinc-600 px-2.5 py-1.5 text-xs font-medium text-zinc-200 transition-colors hover:bg-zinc-800" onclick="addRule()">
                            <i class="fa-solid fa-plus mr-1"></i>Add Rule
                        </button>
                    </div>
                    <div id="policy-rules"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="rounded-lg border border-zinc-600 px-3 py-1.5 text-sm font-medium text-zinc-200 transition-colors hover:bg-zinc-800" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="save-policy-btn" class="rounded-lg bg-[#fdaa02] px-3 py-1.5 text-sm font-semibold text-black transition-colors hover:bg-[#e89a02]" onclick="savePolicy()">
                    <i class="fa-solid fa-save mr-1"></i>Save Policy
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/js/vork-modal.js" th:src="@{/js/vork-modal.js}"></script>
<script src="/js/settings-approval-policies.js" th:src="@{/js/settings-approval-policies.js}"></script>
</body>
</html>
