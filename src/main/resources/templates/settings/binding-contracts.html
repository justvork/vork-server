<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Binding Contracts - Vork</title>
    <link rel="icon" type="image/png" href="/images/Vork-Faviconx128.png" th:href="@{/images/Vork-Faviconx128.png}">
    <link rel="stylesheet" href="/css/tailwind.css" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" href="/packages/npm.fortawesome/fontawesome-free/current/css/all.min.css" th:href="@{/packages/npm.fortawesome/fontawesome-free/current/css/all.min.css}">
    <link rel="stylesheet" href="/css/vork.css" th:href="@{/css/vork.css}">
    <link rel="stylesheet" href="/css/settings.css" th:href="@{/css/settings.css}">
    <link rel="stylesheet" href="/css/binding-contracts.css" th:href="@{/css/binding-contracts.css}">
</head>
<body class="bg-zinc-950 text-zinc-100">
<div th:replace="~{fragments/header :: header}"></div>
<div class="vork-page-shell py-4">
    <div class="vork-page-header">
        <div>
            <h2 class="flex items-center gap-2 text-2xl font-bold text-zinc-100"><i class="fa-solid fa-file-contract text-[#fdaa02]"></i>Binding Contracts</h2>
            <p class="vork-page-subtitle">Create contract groups first, then manage contract tools individually.</p>
        </div>
        <div class="vork-page-header-actions">
            <button id="new-contract-btn" class="rounded-lg bg-[#fdaa02] px-3 py-2 text-sm font-semibold text-black transition-colors hover:bg-[#e89a02]">
                <i class="fa-solid fa-plus mr-2"></i>New Group
            </button>
            <button id="import-contract-btn" class="rounded-lg border border-emerald-500/40 px-3 py-2 text-sm font-medium text-emerald-300 transition-colors hover:bg-emerald-500/15">
                <i class="fa-solid fa-file-import mr-2"></i>Import
            </button>
            <input id="import-contract-input" type="file" accept="application/json" class="hidden">
        </div>
    </div>

    <div class="vork-content-stack">
        <div id="alert-area"></div>
        <div class="overflow-hidden rounded-xl border border-zinc-800 bg-zinc-900">
            <div id="empty-state" class="vork-empty-state-card hidden">
                <i class="fa-solid fa-file-contract vork-empty-icon"></i>
                <p class="vork-empty-title">No binding contracts yet</p>
                <p class="vork-empty-hint">Create a contract to standardize tool input across bindings.</p>
            </div>
            <div id="table-container" class="overflow-x-auto hidden">
                <table class="min-w-full text-left text-sm text-zinc-200">
                    <thead>
                    <tr class="border-b border-zinc-800 text-xs uppercase tracking-wide text-zinc-400">
                        <th class="px-3 py-2">Name</th>
                        <th class="px-3 py-2">VID</th>
                        <th class="px-3 py-2">Tools</th>
                        <th class="px-3 py-2">Artifact Status</th>
                        <th class="px-3 py-2 text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="contracts-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="contractModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-6xl rounded-xl border border-zinc-700 bg-zinc-900 shadow-2xl">
        <div class="flex items-center justify-between border-b border-zinc-800 px-5 py-3">
            <h3 id="contract-modal-title" class="text-lg font-semibold text-zinc-100">New Binding Contract</h3>
            <button id="close-contract-modal" class="rounded-md border border-zinc-700 px-2 py-1 text-zinc-300 transition-colors hover:bg-zinc-800" aria-label="Close">×</button>
        </div>
        <div class="space-y-4 px-5 py-4 contract-modal-body">
            <div id="contract-modal-alert"></div>
            <input id="contract-id" type="hidden">

            <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
                <div>
                    <label class="mb-1 block text-sm font-medium text-zinc-300" for="contract-group-id">Group ID <span class="text-rose-400">*</span></label>
                    <input id="contract-group-id" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" placeholder="binding">
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-zinc-300" for="contract-artifact-id">Artifact ID <span class="text-rose-400">*</span></label>
                    <input id="contract-artifact-id" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" placeholder="emailtriage">
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-zinc-300" for="contract-version">Version <span class="text-rose-400">*</span></label>
                    <input id="contract-version" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" value="SNAPSHOT">
                </div>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-zinc-300" for="contract-name">Name <span class="text-rose-400">*</span></label>
                <input id="contract-name" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" placeholder="Email Triage Contract">
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-zinc-300" for="contract-description">Description</label>
                <textarea id="contract-description" class="min-h-20 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" placeholder="Describe what this contract standardizes."></textarea>
            </div>
        </div>
        <div class="flex items-center justify-end gap-2 border-t border-zinc-800 px-5 py-3">
            <button id="cancel-contract-btn" class="rounded-lg border border-zinc-600 px-3 py-1.5 text-sm font-medium text-zinc-200 transition-colors hover:bg-zinc-800">Cancel</button>
            <button id="save-contract-btn" class="rounded-lg bg-[#fdaa02] px-3 py-1.5 text-sm font-semibold text-black transition-colors hover:bg-[#e89a02]">
                <i class="fa-solid fa-save mr-1"></i>Save Group
            </button>
        </div>
    </div>
</div>

<div id="toolModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-4xl rounded-xl border border-zinc-700 bg-zinc-900 shadow-2xl">
        <div class="flex items-center justify-between border-b border-zinc-800 px-5 py-3">
            <h3 id="tool-modal-title" class="text-lg font-semibold text-zinc-100">Edit Tool</h3>
            <button id="close-tool-modal" class="rounded-md border border-zinc-700 px-2 py-1 text-zinc-300 transition-colors hover:bg-zinc-800" aria-label="Close">×</button>
        </div>
        <div class="space-y-4 px-5 py-4 contract-modal-body">
            <div id="tool-modal-alert"></div>
            <input id="tool-contract-id" type="hidden">
            <input id="tool-original-name" type="hidden">

            <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                <div>
                    <label class="mb-1 block text-sm font-medium text-zinc-300" for="tool-name">Tool Name <span class="text-rose-400">*</span></label>
                    <input id="tool-name" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" placeholder="classifyEmail">
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-zinc-300" for="tool-description">Description</label>
                    <input id="tool-description" type="text" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100" placeholder="Describe the tool purpose.">
                </div>
            </div>

            <label class="inline-flex items-center gap-2 text-sm text-zinc-300" for="tool-publicly-visible">
                <input id="tool-publicly-visible" type="checkbox" class="h-4 w-4 rounded border-zinc-700 bg-zinc-950" checked>
                Public (advertise to reflection consumers)
            </label>

            <div class="rounded-lg border border-zinc-800 bg-zinc-950/50 p-3">
                <div class="mb-3 flex items-center justify-between">
                    <h4 class="text-sm font-semibold text-zinc-200">Input Parameters</h4>
                    <button id="add-tool-param-btn" class="rounded-md border border-zinc-700 px-2 py-1 text-xs text-zinc-200 transition-colors hover:bg-zinc-800" type="button">
                        <i class="fa-solid fa-plus mr-1"></i>Add Parameter
                    </button>
                </div>
                <div id="tool-params-list" class="space-y-2"></div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-2 border-t border-zinc-800 px-5 py-3">
            <button id="cancel-tool-modal" class="rounded-lg border border-zinc-600 px-3 py-1.5 text-sm font-medium text-zinc-200 transition-colors hover:bg-zinc-800">Cancel</button>
            <button id="save-tool-btn" class="rounded-lg bg-[#fdaa02] px-3 py-1.5 text-sm font-semibold text-black transition-colors hover:bg-[#e89a02]">
                <i class="fa-solid fa-save mr-1"></i>Save Tool
            </button>
        </div>
    </div>
</div>

<script src="/js/settings-binding-contracts.js?v=20260905.1" th:src="@{/js/settings-binding-contracts.js(v='20260905.1')}"></script>
</body>
</html>
