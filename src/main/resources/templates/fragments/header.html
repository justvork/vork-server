<th:block th:fragment="header">
<header class="flex items-center justify-between border-b border-zinc-800 bg-zinc-950 px-4 py-2">
    <div class="flex items-center gap-2">
        <a href="/" th:href="@{/}" class="flex items-center gap-2 no-underline group">
            <img src="/images/Vork-Faviconx128.png" th:src="@{/images/Vork-Faviconx128.png}" alt="Vork" width="28" height="28">
            <span class="font-bold text-[#fdaa02] text-base tracking-tight">Vork</span>
        </a>
        <span th:if="${isChatPage}" class="pl-1 text-xs text-zinc-500">AI Chat</span>
        <span th:if="${isChatPage}" id="status-dot" class="status-dot connecting ml-1" title="Connecting&hellip;"></span>
    </div>
    <nav class="flex items-center gap-2">
        <a th:unless="${isChatPage}" href="/index.html" th:href="@{/index.html}" title="Back to chat"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-comments"></i>
        </a>

        <button th:if="${isChatPage}" id="thinking-toggle" type="button" class="rounded-lg border border-zinc-700 px-2.5 py-1 text-xs font-medium text-zinc-200 transition-colors hover:bg-zinc-800" title="Toggle reasoning visibility">
            Thinking ON
        </button>
        <select th:if="${isChatPage}" id="agent-select" class="min-w-[180px] rounded-lg border border-zinc-700 bg-zinc-950 px-2.5 py-1.5 text-sm text-zinc-100 focus:border-[#fdaa02] focus:outline-none focus:ring-2 focus:ring-[#fdaa02]/25" title="Active agent">
            <option value="">Default (Concierge)</option>
        </select>

        <a th:if="${!navAdminView}" href="/notifications" th:href="@{/notifications}" title="My Notifications"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-bell"></i>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/agents" th:href="@{/agents}" title="Agents"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-robot"></i>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/skills" th:href="@{/skills}" title="Skills"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-bolt"></i>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/surfaces" th:href="@{/surfaces}" title="Surfaces"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-layer-group"></i>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/reflections" th:href="@{/reflections}" title="Reflections"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/jobs" th:href="@{/jobs}" title="Jobs"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </a>
        <a href="/attention" th:href="@{/attention}" title="Needs Attention"
           id="needs-attention-link"
           class="relative inline-flex h-8 items-center justify-center gap-1 rounded-lg border border-zinc-700 px-2.5 text-xs font-medium text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span class="hidden sm:inline">Needs Attention</span>
            <span id="needs-attention-badge" class="hidden pointer-events-none absolute right-0 top-0 z-20 min-w-[1.1rem] -translate-y-1/2 translate-x-1/2 rounded-full bg-[#fdaa02] px-1 text-center text-[10px] font-bold leading-4 text-black">0</span>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/settings" th:href="@{/settings}" title="Settings"
           id="settings-btn"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-gear"></i>
        </a>
        <a th:if="${canManageUsers and navAdminView}" href="/ui/layout/user" th:href="@{/ui/layout/user}" title="My Account"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-user"></i>
        </a>
        <a th:if="${canManageUsers and !navAdminView}" href="/ui/layout/admin" th:href="@{/ui/layout/admin}" title="Administration"
           class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-shield-halved"></i>
        </a>
        <button th:if="${isChatPage}" id="logout-btn" type="button" title="Logout"
                class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:bg-zinc-800">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
        <form th:unless="${isChatPage}" id="logout-form" method="post" action="/logout" th:action="@{/logout}" class="contents">
            <button type="submit" title="Logout"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 transition-colors hover:border-red-500/50 hover:text-red-400">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </form>
    </nav>
</header>
<script src="/js/header-nav.js" th:src="@{/js/header-nav.js}"></script>
</th:block>
